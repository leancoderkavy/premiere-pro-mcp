name: Deploy site to Fly

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "src/**"
      - "docs/supported-actions.md"
      - "release-metadata.json"
      - "scripts/generate-marketing-reference.mjs"
      - "scripts/tool-reference-data.mjs"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy premiere-pro-mcp.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Require deploy token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is missing. Create one with 'fly tokens create deploy -a premiere-pro-mcp' and add it as a repository or production environment secret."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.4.107
      - name: Deploy
        run: flyctl deploy --remote-only --app premiere-pro-mcp --build-arg VCS_REF=${{ github.sha }}
      - name: Verify live release metadata
        run: |
          expected=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://premiere-pro-mcp.com/llms.txt | grep -q "Source package version: ${expected}."; then
              echo "Live site reports source version ${expected}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live site does not report source version ${expected}."
          exit 1
