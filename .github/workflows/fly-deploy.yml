name: Deploy MCP server to Fly

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/copy-adobe-uxp-coverage.mjs"
      - "scripts/generate-adobe-api-inventory.mjs"
      - "scripts/generate-uxp-js-api-inventory.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy premiere-pro-mcp.fly.dev MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Require deploy token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is missing. Create one with 'fly tokens create deploy -a premiere-pro-mcp' and add it as a repository or production environment secret."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Repository Actions policy allows only GitHub-owned actions, so install
      # a pinned flyctl with Fly's official installer instead of flyctl-actions.
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh -s 0.4.107
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Deploy
        run: flyctl deploy --remote-only --app premiere-pro-mcp --build-arg VCS_REF=${{ github.sha }}
      - name: Verify live health endpoint
        run: |
          expected=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 https://premiere-pro-mcp.fly.dev/health || true)
            if [ -n "$body" ] && printf '%s' "$body" | EXPECTED="$expected" node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                let health = {};
                try { health = JSON.parse(raw); } catch {}
                const ok = health.status === "ok" && health.service === "premiere-pro-mcp" && health.version === process.env.EXPECTED;
                process.exit(ok ? 0 : 1);
              });
            '; then
              echo "premiere-pro-mcp.fly.dev/health reports version ${expected}."
              exit 0
            fi
            echo "Attempt ${attempt}: health did not report version ${expected}: ${body}"
            sleep 10
          done
          echo "::error::https://premiere-pro-mcp.fly.dev/health did not return status ok for version ${expected}."
          exit 1
