name: Landing validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --prefix landing
      - run: npm ci
      - run: npm run build
      - run: npm --prefix landing run lint
      - run: npm --prefix landing run build
      - run: node landing/scripts/check-seo-export.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: landing
      - run: npm run test:e2e
        working-directory: landing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: homepage-e2e-report
          path: |
            landing/playwright-report/
            landing/test-results/
          retention-days: 7
