name: Connector installers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_production_signing:
        description: Fail unless platform signing identities are configured
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  connector-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and verify CEP connector
        shell: pwsh
        run: ./scripts/build-signed-cep.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connector-package
          path: artifacts/MCPBridgeCEP.zxp
          if-no-files-found: error

  windows-installer:
    needs: connector-package
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: connector-package
          path: artifacts
      - name: Restore Windows signing certificate
        if: ${{ env.WINDOWS_SIGNING_PFX_BASE64 != '' }}
        shell: pwsh
        run: '[IO.File]::WriteAllBytes("$env:RUNNER_TEMP\windows-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))'
      - name: Build Windows installer
        shell: pwsh
        env:
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $params = @{}
          if (Test-Path "$env:RUNNER_TEMP\windows-signing.pfx") {
            $params.SigningCertificatePath = "$env:RUNNER_TEMP\windows-signing.pfx"
            $params.SigningCertificatePassword = $env:SIGNING_PASSWORD
          }
          if ('${{ inputs.require_production_signing }}' -eq 'true') { $params.RequireSigning = $true }
          ./scripts/build-connector-installer.ps1 @params
      - name: Verify embedded connector package without installing it
        shell: pwsh
        run: |
          $installer = Get-ChildItem "artifacts/connector-installers/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows connector installer artifact was not produced." }
          $result = Start-Process -FilePath $installer.FullName -ArgumentList "--verify-only" -Wait -PassThru -NoNewWindow
          if ($result.ExitCode -ne 0) { throw "Windows connector installer verification failed." }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connector-installer-windows
          path: artifacts/connector-installers/*.exe
          if-no-files-found: error

  macos-installer:
    needs: connector-package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: connector-package
          path: artifacts
      - name: Build macOS installer preview
        shell: bash
        env:
          REQUIRE_SIGNING: ${{ inputs.require_production_signing || 'false' }}
        run: ./scripts/build-connector-installer.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connector-installer-macos
          path: |
            artifacts/connector-installers/*.pkg
            artifacts/connector-installers/*.command
          if-no-files-found: error
