name: Build Claude Desktop MCPB

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    name: Build standards-current MCPB
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Verify release identity
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-tag.mjs
      - run: npm run build:claude
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: premiere-pro-mcp-claude-desktop
          path: |
            artifacts/*.mcpb
          if-no-files-found: error
      - name: Attach bundles to release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          artifacts/*.mcpb --clobber
