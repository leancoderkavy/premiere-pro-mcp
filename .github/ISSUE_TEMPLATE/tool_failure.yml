name: Tool failure
description: Report a supported MCP tool that returned an error or an unverified result.
title: "[Tool]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include project media, prompt contents, tool arguments containing paths, access tokens, or proprietary project details.
  - type: input
    id: tool
    attributes:
      label: Tool name
      placeholder: move_clip
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Premiere Pro MCP version
      placeholder: 1.11.3
    validations:
      required: true
  - type: input
    id: premiere-version
    attributes:
      label: Premiere Pro version
      placeholder: 26.3.0
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Reported backend
      options:
        - CEP / ExtendScript
        - QE DOM
        - UXP
        - Local
        - Orchestrator
        - Not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected observable result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual sanitized result or diagnostics
      description: Include bounded error codes and verification state only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, arguments, paths, project/media names, tokens, and proprietary content.
          required: true
